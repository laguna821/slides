name: Prepare Pele source preview
on:
  workflow_dispatch:
concurrency:
  group: pele-source-preview-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Collect all technical checks and diagnostics
        run: node scripts/remote-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pele-source-preview
          retention-days: 1
          path: |
            validation/remote-preview/
            validation/atlas-diagnostics/
            web-dist/
            dist/
            !dist/**/*.pdf
            !dist/**/*.zip
            !dist/**/*.png
            !dist/**/*.webp
            !dist/**/*.svg
            !dist/**/*.woff2
            !dist/**/*.jpg
            !dist/**/*.jpeg
            !dist/**/*.mp4
            !dist/**/*.mov
            src/generated/
          include-hidden-files: false
