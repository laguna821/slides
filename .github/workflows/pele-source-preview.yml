name: Prepare Pele source preview
on:
  push:
    branches: [pele-statistics-source-guide, pele-atlas-editorial]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:source
      - run: npm run check
      - run: npm test
      - name: Prepare web deployment files
        run: npx tsx scripts/build-web.ts --write-redirects
      - name: Collect missing translations
        if: always()
        run: npx tsx scripts/report-missing-translations.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pele-source-preview
          retention-days: 1
          path: |
            dist/talks/pele-atlas/
            dist/en/talks/pele-atlas/
            dist/_astro/
            dist/pele-atlas/
            !dist/**/*.pdf
            !dist/**/*.zip
            !dist/**/*.png
            !dist/**/*.webp
            !dist/**/*.svg
            !dist/**/*.woff2
            !dist/**/*.jpg
            !dist/**/*.jpeg
            !dist/**/*.mp4
            !dist/**/*.mov
            src/generated/
            validation/atlas-diagnostics/
            web-dist/
          include-hidden-files: false
