name: Validate studio release
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: studio-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  studio-validation:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - id: verify
        run: npm run release:verify
      - name: Prepare bilingual upload confirmation
        if: always()
        env:
          UPLOAD_VALIDATION: ${{ steps.verify.outcome }}
        run: npm run upload:request
      - name: Save confirmation request
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-upload-request
          path: validation/upload-request/
          if-no-files-found: warn
