<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-treemap" viewBox="0 0 656 416" width="656" height="416" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_hw:var(--pele-heading-weight,bold);--_fm:var(--pele-font-mono,Achmage SameTone);font:18px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Achmage SameTone)" fill="var(--_fg)" aria-roledescription="treemap" role="img" aria-labelledby="treemap-title treemap-desc"><title id="treemap-title">계층 구성비</title><desc id="treemap-desc">계층별 부분의 크기는 얼마인가 · 합성 자료</desc><style>.pele{--pele-bg:#ffffff;--pele-fg:#16334a;--pele-muted:#526778;--pele-line:#526778;--pele-surface:#eef5fb;--pele-surface-alt:#dfedf5;--pele-border:#6c879b;--pele-accent:#007F86;--pele-critical:#a23737;--pele-error:#a23737;--pele-series-1:#0066B3;--pele-series-2:#007F86;--pele-series-3:#002E6E;--pele-series-4:#6c4b85;--pele-series-5:#8b551c;--pele-series-6:#366b4b;--pele-series-7:#8c425c;--pele-series-8:#475f86;--pele-font:"Achmage SameTone";--pele-font-mono:"Achmage SameTone";background:var(--pele-bg)}.achmage-key>rect,.achmage-key>path,.achmage-key>polygon{stroke:var(--pele-accent);stroke-width:3}.achmage-interpretation>rect,.achmage-interpretation>polygon{stroke-dasharray:5 3}.achmage-aux>rect,.achmage-aux>polygon{fill:var(--pele-surface-alt)}.achmage-data-marker{stroke:var(--pele-bg);stroke-width:2}</style><g class="pele-sections" font-size="16"><g class="pele-node pele-section" data-id="검토"><rect x="8" y="8" width="640" height="400" fill="var(--pele-series-1,#4c78a8)" fill-opacity="0.12" stroke="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text x="16" y="28.6" font-weight="var(--_hw)">검토</text><