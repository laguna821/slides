<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전체 그림 펼쳐 보기</title><link rel="stylesheet" href="/pele/style.css"><style>main{max-width:1600px}.sheet{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tile{background:var(--paper);border:1px solid var(--line);padding:18px;border-radius:10px;overflow:hidden}.tile svg{width:100%!important;height:270px!important;max-width:100%;min-width:0!important}.tile h2{font-size:16px;margin:0 0 15px}.tile p{font-size:11px;color:var(--muted)}nav{display:flex;gap:20px;flex-wrap:wrap;margin:20px 0}@media(max-width:700px){.sheet{grid-template-columns:1fr}}</style><link rel="canonical" href="https://achmage-slides.vercel.app/pele/visual/"></head><body><main><a href="/pele/">전체 도표군</a> · <a href="/pele/coverage/">검증 기록</a><h1>모든 그림을 펼쳐 보기</h1><p>104개 실제 사례. 작은 미리보기이며 각 제목을 열면 원래 크기와 전체 데이터를 볼 수 있습니다.</p><nav id="nav"></nav><div class="sheet" id="sheet"></div></main><script type="module">
import {tokens} from '/pele/engine/runtime/brand.mjs';
const q=new URLSearchParams(location.search),batch=Number(q.get('batch')||0),theme=q.get('theme')||'light';document.documentElement.dataset.theme=theme;
const pages=await(await fetch('/pele/data/catalog.json')).json(),cases=pages.flatMap(p=>p.cases.map(c=>({...c,page:p.id}))),items=cases.slice(batch*8,(batch+1)*8);
document.querySelector('#nav').innerHTML=Array.from({length:Math.ceil(cases.length/8)},(_,i)=>'<a href="?batch='+i+'&theme='+theme+'">'+(i*8+1)+'–'+Math.min(cases.length,(i+1)*8)+'</a>').join('')+'<a href="?batch='+batch+'&theme='+(theme==='light'?'dark':'light')+'">테마 전환</a>';
for(const item of items){const c=await(await fetch(item.url)).json(),div=document.createElement('section');div.className='tile';div.innerHTML='<h2><a href="/pele/diagrams/'+c.kind+'/?case='+c.id+'">'+c.label+'</a></h2>'+c.svg+'<p>'+c.engine+'</p>';document.querySelector('#sheet').append(div);for(const s of div.querySelectorAll('svg'))for(const[k,v]of Object.entries(tokens(theme)))s.style.setProperty(k,v);}
await document.fonts.ready;document.body.dataset.ready='true';
</script></body></html>
